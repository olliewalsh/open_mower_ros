PurePursuitTracker:
  # Parameters are refreshed from the ROS parameter server once per second and
  # may be changed while the controller is running.
  heading_gain: 2.0
  mowing_speed: 0.25
  minimum_tracking_speed: 0.10
  max_angular_speed: 1.8
  max_acceleration: 0.15
  max_deceleration: 0.30
  cross_track_slowdown_gain: 3.0
  curvature_preview_distance: 0.35
  curvature_angular_fraction: 0.50
  # Adaptive pure-pursuit lookahead: min + lookahead_time * commanded speed.
  minimum_lookahead: 0.15
  maximum_lookahead: 0.35
  lookahead_time: 0.40
  sharp_corner_angle: 0.52
  # Treat a large cumulative heading reversal within this distance as a turnaround,
  # braking for its first vertex even when that individual corner is shallow.
  turnaround_angle_threshold: 2.10
  turnaround_preview_distance: 1.50
  corner_slowdown_distance: 0.40
  corner_position_tolerance: 0.10
  rotate_threshold: 0.70
  rotate_tolerance: 0.17
  # If an in-place turn makes no meaningful heading progress, move a short
  # collision-checked distance to regain traction and retry once.
  rotate_progress_timeout: 5.0
  rotate_progress_angle: 0.05
  rotate_escape_distance: 0.10
  rotate_escape_speed: 0.10
  rotate_escape_timeout: 5.0
  rotate_escape_attempts: 1
  # Abort if normal forward tracking commands motion but the monotonic path
  # projection does not advance by this distance within the timeout.
  tracking_progress_timeout: 5.0
  tracking_progress_distance: 0.05
  tracking_progress_min_speed: 0.05
  goal_distance_tolerance: 0.20
  goal_angle_tolerance: 0.17
  goal_slowdown_distance: 0.50
  # Return MISSED_GOAL if the path is exhausted outside the position tolerance.
  goal_position_timeout: 2.0
  projection_search_window: 100
  # Maximum initial along-path projection. Further progress requires matching
  # physical robot movement, preventing stationary jumps on closed paths.
  projection_initial_allowance: 0.50
  # Scale each measured pose step; unused projection allowance is not accumulated.
  projection_distance_factor: 1.50
  # Ignore smaller pose changes and cap large localization jumps (metres/update).
  projection_pose_deadband: 0.002
  projection_max_pose_step: 0.25
  check_collisions: true
  unknown_is_obstacle: true
  collision_horizon: 2.0
  collision_time_step: 0.10
  braking_deceleration: 0.40
  reaction_time: 0.20
  collision_margin: 0.10
  max_mow_motor_current: 6.0
  mow_current_gain: 0.125
  min_mow_motor_rpm: 2000.0
  mow_rpm_gain: 0.0002
